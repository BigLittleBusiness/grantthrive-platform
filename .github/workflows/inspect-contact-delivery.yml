name: Inspect Public Contact Delivery

on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "System log lookback window"
        required: false
        default: "24 hours ago"
        type: string

jobs:
  inspect:
    name: Inspect redacted delivery status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect BinaryLane service logs
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            LOOKBACK='${{ inputs.lookback }}'
            journalctl -u grantthrive-api --since "$LOOKBACK" --no-pager -o cat > /tmp/grantthrive-contact-log-check.txt || true
            sent=$(grep -Eic 'SES email sent to .*GrantThrive - (Demo enquiry|Pricing enquiry|Support enquiry|General enquiry|Waitlist signup)' /tmp/grantthrive-contact-log-check.txt || true)
            failed=$(grep -Eic 'SES send failed to' /tmp/grantthrive-contact-log-check.txt || true)
            submitted=$(grep -Eic 'public_contact\.submitted' /tmp/grantthrive-contact-log-check.txt || true)
            configured=$(grep -Eic 'CONTACT_INBOX_EMAIL is not configured' /tmp/grantthrive-contact-log-check.txt || true)
            categories=$(grep -Eo 'GrantThrive - (Demo enquiry|Pricing enquiry|Support enquiry|General enquiry|Waitlist signup)' /tmp/grantthrive-contact-log-check.txt | sort -u | tr '\n' ';' || true)
            rm -f /tmp/grantthrive-contact-log-check.txt
            printf 'contact_delivery_log_lookback=%s\n' "$LOOKBACK"
            printf 'contact_delivery_success_count=%s\n' "$sent"
            printf 'recent_ses_failure_count=%s\n' "$failed"
            printf 'contact_submission_audit_log_count=%s\n' "$submitted"
            printf 'recipient_configuration_error_count=%s\n' "$configured"
            printf 'contact_subject_categories=%s\n' "${categories:-none}"
