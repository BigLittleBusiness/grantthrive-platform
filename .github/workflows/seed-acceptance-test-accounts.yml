name: Seed Isolated Acceptance Test Accounts

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed GrantThrive Test Council accounts
        uses: appleboy/ssh-action@v1.0.0
        env:
          ACCEPTANCE_TEST_ADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_TEST_ADMIN_PASSWORD }}
          ACCEPTANCE_TEST_STAFF_PASSWORD: ${{ secrets.ACCEPTANCE_TEST_STAFF_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: ACCEPTANCE_TEST_ADMIN_PASSWORD,ACCEPTANCE_TEST_STAFF_PASSWORD
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            set -a
            source .env
            set +a
            venv/bin/python - <<'PY'
            import re
            from pathlib import Path

            source = Path('manage.py').read_text(encoding='utf-8')
            names = sorted(set(re.findall(r"os\.environ\.get\(['\"]([^'\"]+)", source)))
            test_names = [name for name in names if 'TEST' in name or 'ACCEPTANCE' in name]
            print('Acceptance configuration variables:', ', '.join(test_names) or 'none found')
            for line in source.splitlines():
                if 'council_admin_test' in line or 'council_staff_test' in line or ('subdomain' in line and 'test' in line):
                    print('Acceptance account configuration detected.')
                    break
            PY
            GT_TEST_ADMIN_PASSWORD="$ACCEPTANCE_TEST_ADMIN_PASSWORD" \
            GT_TEST_STAFF_PASSWORD="$ACCEPTANCE_TEST_STAFF_PASSWORD" \
            venv/bin/python manage.py seed-test-accounts
            venv/bin/python - <<'PY'
            import os

            from app import create_app, db
            from app.common.encryption import hmac_index
            from app.models import User

            app = create_app()
            with app.app_context():
                accounts = (
                    ('council_admin_test@grantthrive.com', 'council_admin', os.environ['ACCEPTANCE_TEST_ADMIN_PASSWORD']),
                    ('council_staff_test@grantthrive.com', 'council_staff', os.environ['ACCEPTANCE_TEST_STAFF_PASSWORD']),
                )
                for email, role, password in accounts:
                    user = User.query.filter_by(email_hmac=hmac_index(email)).first()
                    if user is None or user.role != role:
                        raise RuntimeError(f'Expected isolated {role} acceptance account was not found.')
                    user.set_password(password)
                    user.is_active = True
                    user.is_approved = True
                db.session.commit()
            print('Isolated acceptance account credentials refreshed.')
            PY
            echo "Isolated GrantThrive Test Council accounts seeded."
